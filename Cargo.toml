[package]
name = "xa401-bridge"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native XA401 receiver and Mirakurun-compatible bridge"
repository = "https://github.com/ryuya0124/xa401-mirakurun-bridge-rust"
readme = "README.md"

[dependencies]
anyhow = "1"
arib = { version = "0.3.0", default-features = false, features = ["text"] }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
openssl = { version = "0.10.82", features = ["vendored"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
roxmltree = "0.21"
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.29"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
