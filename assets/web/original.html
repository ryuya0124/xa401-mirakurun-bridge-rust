<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>XA401 · Original画質で視聴</title>
<style>body{font:17px system-ui;max-width:650px;margin:12vh auto;padding:24px;color:#eee;background:#17171c;line-height:1.8}button{font:inherit;padding:12px 24px;background:#e64f97;border:0;border-radius:8px;color:white;cursor:pointer}small{color:#aaa}</style>
<h1>XA401を元画質で見る</h1>
<p>KonomiTVの視聴画質を「Original (MPEG-2)」に設定して開きます。XA401から元画質を受信し、サーバーで映像を再圧縮せず配信します。</p>
<p>ブラウザー側では表示用のMPEG-2変換が行われます。変換済みの1080p・720pなどを選ぶと、サーバー側の再圧縮が有効になります。</p>
<button id="open">Original画質で視聴</button>
<p><a style="color:#ffb5d5" href="/videos/">KonomiTVの録画を見る</a> · <a style="color:#ffb5d5" href="/api/xa401/recordings">PC録画・予約の管理</a></p>
<p id="message"></p><small>変更するのは、このブラウザーの視聴画質と通信節約設定だけです。</small>
<script>
document.getElementById('open').onclick = () => {
    try {
        const key = 'KonomiTV-Settings';
        const settings = JSON.parse(localStorage.getItem(key) || '{}');
        if (settings === null || typeof settings !== 'object' || Array.isArray(settings)) throw new Error();
        Object.assign(settings, {tv_streaming_quality: 'original', tv_streaming_quality_cellular: 'original',
            tv_data_saver_mode: false, tv_data_saver_mode_cellular: false,
            video_streaming_quality: 'original', video_streaming_quality_cellular: 'original',
            video_data_saver_mode: false, video_data_saver_mode_cellular: false});
        localStorage.setItem(key, JSON.stringify(settings));
        location.assign('/tv/watch/gr011');
    } catch (_) {
        document.getElementById('message').textContent = '設定を保存できませんでした。KonomiTVの設定画面でOriginalを選んでください。';
    }
};
</script></html>
