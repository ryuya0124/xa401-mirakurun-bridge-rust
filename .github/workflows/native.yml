name: Native Rust
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Strawberry Perl on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlPath = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perlPath)) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "PERL=$perlPath" >> $env:GITHUB_ENV
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - run: cargo +1.100.0 fmt --check
      - run: cargo +1.100.0 test --locked
      - run: cargo +1.100.0 build --release --locked
      - run: node --test tests/test_*.mjs
