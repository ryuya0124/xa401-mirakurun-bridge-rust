name: Native Rust
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Strawberry Perl on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlPath = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perlPath)) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "PERL=$perlPath" >> $env:GITHUB_ENV
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Build pinned OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-openssl.ps1
          "OPENSSL_DIR=$env:OPENSSL_DIR" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          "LC_ALL=C" >> $env:GITHUB_ENV
          "LC_CTYPE=C" >> $env:GITHUB_ENV
      - name: Build pinned OpenSSL on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/build-openssl.sh
          . ./openssl-build.conf
          echo "OPENSSL_DIR=$PWD/target/openssl-$OPENSSL_VERSION/install" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - run: cargo +1.100.0 fmt --check
      - run: cargo +1.100.0 test --locked
      - run: cargo +1.100.0 build --release --locked
      - run: node --test tests/test_*.mjs
